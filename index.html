<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LFIA - IA de Estudos</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <main class="container">

        <header>

            <h1>
                🤖 LFIA
            </h1>

            <p>
                Sua IA para ajudar nos estudos
            </p>

        </header>


        <section class="card">

            <h2>
                Escolha uma matéria
            </h2>

            <div class="materias">

                <button class="materia">
                    📐 Matemática
                </button>

                <button class="materia">
                    📖 Português
                </button>

                <button class="materia">
                    🌎 Geografia
                </button>

                <button class="materia">
                    🔬 Ciências
                </button>

                <button class="materia">
                    📜 História
                </button>

            </div>

        </section>


        <section class="card">

            <h2>
                Faça sua pergunta
            </h2>

            <textarea
                id="pergunta"
                placeholder="Exemplo: Explique frações de um jeito fácil"
            ></textarea>

            <button
                id="botaoPerguntar"
            >

                Perguntar para a LFIA ➤

            </button>

        </section>


        <section
            class="card resposta"
            id="resposta"
        >

            <h3>
                👋 Olá!
            </h3>

            <p>
                Eu sou a LFIA.
                Escolha uma matéria e faça
                uma pergunta para começar.
            </p>

        </section>

    </main>


    <script
        src="app.js"
    ></script>

</body>

</html>
